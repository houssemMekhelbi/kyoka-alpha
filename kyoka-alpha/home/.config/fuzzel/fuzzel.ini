# Kyoka alpha launcher for fuzzel (unused: SUPER+D runs kyoka-launcher, foot + fzf).
# Layout: centred, 40% width, hairline prompt marker, matches in Violet.

[main]
font=Chakra Petch:size=10.5,IBM Plex Sans Arabic:size=10.5
use-bold=no
prompt="─  "
placeholder=search
icons-enabled=yes
match-counter=yes
anchor=center
lines=8
width=90
horizontal-pad=18
vertical-pad=14
inner-pad=10
line-height=36
letter-spacing=0.2
layer=overlay
terminal=foot -e

[colors]
background=0F0B18DB
text=9C9489FF
message=9C9489FF
prompt=A98BFFFF
placeholder=9C948980
input=EDE8DFFF
match=7B4FD6FF
selection=171225E6
selection-text=EDE8DFFF
selection-match=A98BFFFF
counter=8FD3F4FF
border=A98BFFFF

[border]
width=1
radius=0
