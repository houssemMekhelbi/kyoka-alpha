# Kyoka alpha terminal. Void at 86%, compositor blur behind
# it; output in Muted Bone, emphasis in Bone; Pale Violet block cursor.

[main]
font=Martian Mono:size=10
line-height=19
pad=16x16
initial-color-theme=dark

[bell]
# A bell in a window without the focus marks it urgent, which the bar's workspace slot shows.
urgent=yes

[cursor]
style=block
blink=no
beam-thickness=1.5

[colors-dark]
alpha=0.86
blur=yes
background=07060B
foreground=9C9489
cursor=07060B A98BFF

regular0=07060B
regular1=C24B6B
regular2=5DA88A
regular3=C9B27A
regular4=6E7FD6
regular5=9A6BE8
regular6=7FC4DD
regular7=9C9489

bright0=2A2140
bright1=E06A88
bright2=7FCBA8
bright3=E5CF95
bright4=8F9EF0
bright5=B994FF
bright6=A6DDF0
bright7=EDE8DF

# Raised Violet, no inversion
selection-foreground=EDE8DF
selection-background=171225

jump-labels=07060B A98BFF
scrollback-indicator=07060B 7B4FD6
search-box-no-match=EDE8DF C24B6B
search-box-match=07060B A98BFF
urls=8FD3F4

# The same palette again: a colour-theme key bind cannot pull in foot's stock colours.
[colors-light]
alpha=0.86
blur=yes
background=07060B
foreground=9C9489
cursor=07060B A98BFF

regular0=07060B
regular1=C24B6B
regular2=5DA88A
regular3=C9B27A
regular4=6E7FD6
regular5=9A6BE8
regular6=7FC4DD
regular7=9C9489

bright0=2A2140
bright1=E06A88
bright2=7FCBA8
bright3=E5CF95
bright4=8F9EF0
bright5=B994FF
bright6=A6DDF0
