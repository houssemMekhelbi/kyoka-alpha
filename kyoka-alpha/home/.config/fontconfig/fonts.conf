<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Kyoka alpha type:
       display    Italiana            + Amiri (Arabic), Aoyagi Reisho (Japanese, clerical brush)
       lock screen Aoyagi Reisho ("aoyagireisyo2") for clock, saying and romaji
       interface  Chakra Petch        + IBM Plex Sans Arabic
       data       Martian Mono        + IBM Plex Sans Arabic, JetBrains Mono Nerd Font
     <accept> puts the companion directly after the Latin face, so only glyphs
     the Latin face lacks use it. Martian Mono has no powerline/Nerd glyphs;
     JetBrains Mono Nerd Font supplies them. ▱ ▰ come from Noto Sans Mono /
     DejaVu Sans Mono further down. -->
<fontconfig>
  <alias binding="same">
    <family>Chakra Petch</family>
    <accept><family>IBM Plex Sans Arabic</family><family>aoyagireisyo2</family></accept>
  </alias>
  <alias binding="same">
    <family>Italiana</family>
    <accept><family>Amiri</family><family>aoyagireisyo2</family></accept>
  </alias>
  <alias binding="same">
    <family>Martian Mono</family>
    <accept><family>IBM Plex Sans Arabic</family><family>JetBrainsMono Nerd Font</family></accept>
  </alias>

  <alias binding="same">
    <family>sans-serif</family>
    <prefer>
      <family>Chakra Petch</family>
      <family>IBM Plex Sans Arabic</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>monospace</family>
    <prefer>
      <family>Martian Mono</family>
      <family>JetBrainsMono Nerd Font</family>
      <family>IBM Plex Sans Arabic</family>
      <family>Noto Sans Mono</family>
      <family>DejaVu Sans Mono</family>
    </prefer>
  </alias>
</fontconfig>
