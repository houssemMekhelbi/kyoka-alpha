# Kyoka alpha lock screen, concept C "Tategaki" (chosen 2026-09-19), set in
# Aoyagi Reisho (青柳隷書しも, clerical-script brush by Aoyagi Kouzan, free font).
# The clock off-axis on the left with the date and the field under it; on the
# right the saying stands in vertical columns on a faint violet band, read
# right to left, its romaji turned 90° beside it.
# No username. Sayings: ~/.config/hypr/kyoka-alpha/sayings.txt.

general {
    hide_cursor = true
    immediate_render = true
}

animations {
    enabled = true
}

background {
    monitor =
    path = ~/.config/hypr/kyoka-alpha/wallpaper.png
    color = rgb(07060B)
    blur_passes = 3
    blur_size = 8
    brightness = 0.55
    vibrancy = 0.12
    noise = 0.01
}

# ---- left: clock, date, field ------------------------------------------

label {
    monitor =
    text = $TIME
    color = rgba(EDE8DFFF)
    font_size = 210
    font_family = aoyagireisyo2
    shadow_passes = 2
    shadow_size = 10
    shadow_color = rgba(7B4FD6CC)
    shadow_boost = 1.3
    position = 170, 90
    halign = left
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "<span letter_spacing='9000'>$(date +'%A  ·  %d %B' | tr '[:lower:]' '[:upper:]')</span>"
    color = rgba(9C9489FF)
    font_size = 15
    font_family = Chakra Petch
    position = 190, -80
    halign = left
    valign = center
}

input-field {
    monitor =
    size = 420, 50
    outline_thickness = 1
    outer_color = rgba(A98BFFFF) rgba(7B4FD6FF) rgba(7B4FD640) 160deg
    inner_color = rgba(0F0B18DB)
    font_color = rgba(A98BFFFF)
    font_family = Martian Mono
    check_color = rgba(A98BFFFF) rgba(7B4FD6FF) 160deg
    fail_color = rgba(C24B6BFF)
    capslock_color = rgba(8FD3F4FF)
    rounding = 0
    dots_size = 0.18
    dots_spacing = 0.7
    dots_center = false
    dots_rounding = 0
    fade_on_empty = false
    placeholder_text = <span foreground="##9C9489">─   password</span>
    fail_text = <span foreground="##E06A88">$FAIL</span>
    check_text = <span foreground="##A98BFF">verifying</span>
    position = 190, -150
    halign = left
    valign = center
}

# ---- right: the saying, tategaki in two columns --------------------------
# Column 1 (ようこそ) is the rightmost; column 2 (私のソウル・ソサエティ) stands
# to its left; both start at the same height. The romaji runs down beside them.

# faint violet band behind the columns, and its Pale Violet hairline
shape {
    monitor =
    size = 240, 960
    rounding = 0
    color = rgba(7B4FD61C)
    border_size = 0
    position = -205, 0
    halign = right
    valign = center
}

shape {
    monitor =
    size = 1, 960
    rounding = 0
    color = rgba(A98BFF59)
    border_size = 0
    position = -446, 0
    halign = right
    valign = center
}

label {
    monitor =
    text = cmd[update:600000] $HOME/.local/bin/kyoka-lock-saying jp1
    color = rgba(A98BFFFF)
    font_size = 64
    font_family = aoyagireisyo2
    text_align = center
    shadow_passes = 1
    shadow_size = 6
    shadow_color = rgba(7B4FD688)
    position = -240, -110
    halign = right
    valign = top
}

label {
    monitor =
    text = cmd[update:600000] $HOME/.local/bin/kyoka-lock-saying jp2
    color = rgba(A98BFFFF)
    font_size = 64
    font_family = aoyagireisyo2
    text_align = center
    shadow_passes = 1
    shadow_size = 6
    shadow_color = rgba(7B4FD688)
    position = -340, -110
    halign = right
    valign = top
}

label {
    monitor =
    text = cmd[update:600000] $HOME/.local/bin/kyoka-lock-saying romaji
    color = rgba(EDE8DFD9)
    font_size = 20
    font_family = aoyagireisyo2
    rotate = 90
    position = -140, 0
    halign = right
    valign = center
}

# ---- footer --------------------------------------------------------------

label {
    monitor =
    text = <span letter_spacing='4000'>KYŌKA</span>
    color = rgba(A98BFF59)
    font_size = 9
    font_family = Martian Mono
    position = 190, 40
    halign = left
    valign = bottom
}
