# Kyoka alpha tmux. Status at the bottom
# on Deep Violet. Session name in a Violet block with a slant; the clock in a
# Raised Violet block slanted the other way, with a Pale Violet left rule.
# The slants are Nerd Font glyphs (U+E0BC, U+E0BE) via JetBrainsMono Nerd Font.

set -g default-terminal "tmux-256color"
set -as terminal-features ",foot*:RGB,alacritty*:RGB,xterm-ghostty:RGB,xterm-256color:RGB"

# One status line in tmux's stock layout. Another theme (Nordschleife) runs two lines with its own
# status-format; a running server keeps those across a theme switch unless they are reset here.
set -g status on
set -gu status-format


set -g status-position bottom
set -g status-interval 15
set -g status-justify left
set -g status-style "bg=#0F0B18,fg=#9C9489"

set -g status-left-length 40
set -g status-left "#[bg=#7B4FD6,fg=#EDE8DF] #{=/24/…:session_name} #[bg=#0F0B18,fg=#7B4FD6] "

set -g status-right-length 40
set -g status-right "#[bg=#0F0B18,fg=#171225]#[bg=#171225,fg=#A98BFF]▎#[fg=#EDE8DF]%H:%M "

# Windows are plain index:name. Active on Raised Violet with the left rule,
# others Muted Bone, activity in Ice.
set -g window-status-separator ""
set -g window-status-format "#[fg=#9C9489]  #{?window_activity_flag,#[fg=#8FD3F4],}#I:#W "
set -g window-status-current-format "#[bg=#171225,fg=#A98BFF] ▎#[fg=#EDE8DF]#I:#W "
set -g window-status-activity-style "none"
set -g monitor-activity on
set -g visual-activity off

# Pane borders: active Violet, inactive Hairline.
set -g pane-border-lines single
set -g pane-border-style "fg=#2a2140"
set -g pane-active-border-style "fg=#7b4fd6"
set -g pane-border-indicators off

set -g message-style "bg=#171225,fg=#EDE8DF"
set -g message-command-style "bg=#171225,fg=#A98BFF"
set -g mode-style "bg=#171225,fg=#EDE8DF"
set -g copy-mode-match-style "bg=#171225,fg=#8FD3F4,underscore"
set -g copy-mode-current-match-style "bg=#171225,fg=#A98BFF,underscore"
set -g menu-style "bg=#07060B,fg=#9C9489"
set -g menu-selected-style "bg=#171225,fg=#EDE8DF"
set -g menu-border-style "fg=#7B4FD6"
set -g menu-border-lines single
set -g popup-border-style "fg=#7B4FD6"
set -g popup-border-lines single
set -g display-panes-colour "#2A2140"
set -g display-panes-active-colour "#A98BFF"
set -g clock-mode-colour "#A98BFF"
